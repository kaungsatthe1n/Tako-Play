name: CI

on:
  push:
    paths-ignore:
      - 'README.md'
      - '**/README.md'
      - 'readme.md'
      - '**/readme.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - '**/README.md'
      - 'readme.md'
      - '**/readme.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run tests and collect coverage
        run: flutter test --coverage
